{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeandPlace - AI Outfit Analysis</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="intro">
        <h1 class="title">Welcome to Time & Place</h1>
        <p class="subtitle">Your personal attire and weather assistant for each occasion</p>
    </div>

    <div class="container">
        <div class="controls">
            <div class="dress-buttons">
                <button data-code="casual">Casual</button>
                <button data-code="business-casual">Business Casual</button>
                <button data-code="semi-formal">Semi-Formal</button>
                <button data-code="business-formal">Business Formal</button>
            </div>
            <input type="hidden" id="dress_code" placeholder="casual">
            <input type="number" id="temperature" placeholder="Temperature">

            <button id="capture-btn">Start Analysis</button>
            <button id="stop-btn">Stop Analysis</button>
        </div>

        <video id="video" autoplay></video>
        <canvas id="canvas" width="320" height="240" hidden></canvas>

        <div id="result" class="result">Press Start Analysis to begin!</div>
        <div id="details"></div>
    </div>

    <div id="countdown" class="countdown"></div>
    <script src="/static/js/webcam.js"></script>
</body>
</html>

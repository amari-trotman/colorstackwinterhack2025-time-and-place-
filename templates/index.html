<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeandPlace</title>
</head>
<body>
    <h1>Welcome to TimeandPlace</h1>

    <label>What is the dress code for your event?</label>
    <select id="dress-code">
        <option value="casual">Casual</option>
        <option value="business-casual">Business Casual</option>
        <option value="semi-formal">Semi-Formal</option>
        <option value="business-formal">Business Formal</option>
    </select>

    <label>What will the temperature be like in Farenheit?</label>
    <input type="number" id="temperature" value="70">
</body>
</html>
